<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast — Bid or Bust</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
  body { overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background: url('flyer.jpg') center top / cover no-repeat;
    opacity: 0.22; filter: saturate(1.25);
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(1200px 700px at 50% 0%, rgba(13, 5, 24, 0.55), rgba(13, 5, 24, 0.94) 75%);
  }
  .cast { position: relative; z-index: 1; }
  .cast { min-height: 100vh; display: flex; flex-direction: column; padding: 26px 34px; box-sizing: border-box; }
  .cast-head { display: flex; justify-content: space-between; align-items: center; }
  .cast-title { font-size: clamp(40px, 5vw, 68px); font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
    background: linear-gradient(180deg, #fff3c4 0%, #ffd166 32%, #b8860b 55%, #ffe9a8 78%, #d9a52e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0;
    filter: drop-shadow(0 3px 16px rgba(247, 197, 72, 0.35)); }
  .cast-sub { color: var(--muted); letter-spacing: 3px; font-size: 14px; text-transform: uppercase; }
  .cast-main { flex: 1; display: grid; grid-template-columns: 1.2fr 1fr 0.9fr; gap: 22px; margin-top: 18px; min-height: 0; }
  @media (max-width: 900px) { .cast-main { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; }
  .big-bid { font-size: clamp(70px, 9vw, 130px); font-weight: 800; color: var(--gold); text-shadow: 0 0 40px rgba(247,197,72,.5); font-variant-numeric: tabular-nums; line-height: 1; }
  .big-leader { font-size: clamp(22px, 2.6vw, 34px); margin-top: 8px; }
  .big-leader b { color: var(--sunset-2); }
  .box-xl { font-size: clamp(90px, 10vw, 150px); text-align: center; animation: floaty 2.6s ease-in-out infinite; filter: drop-shadow(0 12px 30px rgba(255,46,136,.5)); }
  .lotline { text-align: center; color: var(--muted); letter-spacing: 2px; font-size: 15px; text-transform: uppercase; margin-top: 6px; }
  .blist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; font-size: clamp(16px, 1.8vw, 22px); }
  .blist li { display: flex; justify-content: space-between; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .ticker { display: flex; gap: 26px; justify-content: center; color: var(--muted); font-size: 15px; padding-top: 14px; flex-wrap: wrap; }
  .ticker b { color: var(--ink); }
  #suspense { font-size: clamp(40px, 6vw, 80px); font-weight: 800; }
</style>
</head>
<body>
<div class="cast">
  <div class="cast-head">
    <div>
      <h1 class="cast-title">🔨 Bid or Bust</h1>
      <div class="cast-sub">PulseVR Presents · Members Lounge</div>
    </div>
    <div style="text-align:right">
      <div class="code-badge" id="codeBadge" style="font-size:40px; letter-spacing:6px">----</div>
      <div class="cast-sub">join on your phone</div>
    </div>
  </div>

  <div class="cast-main">
    <div class="panel" style="align-items:center; justify-content:center">
      <div class="giftbox xl" id="boxGift">
        <div class="crown">👑</div>
        <div class="lid"></div>
        <div class="box"></div>
        <div class="ribbon-v"></div>
        <span class="q">?</span>
      </div>
      <div class="lotline" id="lotLine">Waiting for players…</div>
      <div class="dots" id="dots" style="margin-top:14px"></div>
    </div>

    <div class="panel" style="align-items:center; justify-content:center; text-align:center">
      <div class="kicker" id="phaseKicker">Lobby</div>
      <div class="big-bid" id="bigBid">—</div>
      <div class="big-leader" id="bigLeader"></div>
      <div class="timerbar" style="width:100%; height:16px; margin-top:18px"><div id="timerFill" style="width:100%"></div></div>
      <div class="timertext" id="timerText"></div>
    </div>

    <div class="panel">
      <div class="kicker">🏆 Top players</div>
      <ul class="blist" id="board"></ul>
    </div>
  </div>

  <div class="ticker">
    <span>💰 In: <b id="tIn">0</b></span>
    <span>☠️ Out: <b id="tOut">0</b></span>
    <span>📦 Lots left: <b id="tLeft">15</b></span>
    <span id="tLast"></span>
  </div>
</div>

<div id="revealOverlay" class="reveal-overlay hidden">
  <div class="reveal-card" id="revealCard">
    <div id="suspense" class="shimmer">REVEALING…</div>
    <div id="revealBody" class="hidden">
      <div class="emoji" id="revealEmoji">🎁</div>
      <h2 id="revealTitle">—</h2>
      <p id="revealDetail"></p>
      <p id="revealMeta" class="small"></p>
    </div>
  </div>
</div>

<script>
const socket = io();
const $ = id => document.getElementById(id);
const money = n => '$' + Number(n).toLocaleString();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const code = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
let state = null;

$('codeBadge').textContent = code || '----';

function render(s) {
  state = s;
  $('lotLine').textContent = s.phase === 'lobby' ? `Waiting for players… (${s.players.length} joined)` :
    s.phase === 'done' ? 'Game over — final results!' : `Lot ${s.roundIndex + 1} of ${s.totalLots}`;
  const bg = $('boxGift');
  bg.classList.toggle('sealed', !!s.isSealed);
  bg.querySelector('.q').textContent = s.isSealed ? '🤐' : '?';

  $('phaseKicker').textContent = {
    lobby: 'Lobby — join now!', between: 'Next lot incoming…',
    bidding: '🔨 BIDDING OPEN', sealed: '🤐 SEALED HIGH ROLLER ROUND',
    reveal: 'Revealing…', done: '🏆 Game over',
  }[s.phase] || '';

  if (s.phase === 'bidding') {
    $('bigBid').textContent = money(s.currentBid);
    $('bigLeader').innerHTML = s.highBidderName ? `High bidder: <b>${esc(s.highBidderName)}</b>` : 'No bids yet — opens at $50';
  } else if (s.phase === 'sealed') {
    $('bigBid').textContent = '🤐';
    $('bigLeader').textContent = 'Secret bids — highest wins';
  } else {
    $('bigBid').textContent = '—';
    $('bigLeader').textContent = '';
  }

  $('board').innerHTML = s.players.slice(0, 6).map((p, i) => `
    <li><span>${i === 0 ? '👑 ' : (i + 1) + '. '}${esc(p.name)}</span>
    <span><b style="color:var(--gold)">${money(p.prizeValue)}</b>${p.active ? '' : ' ☠️'}</span></li>`).join('')
    || '<li class="muted">No players yet</li>';

  $('tIn').textContent = s.playersIn;
  $('tOut').textContent = s.playersOut;
  $('tLeft').textContent = s.totalLots ? (s.totalLots - s.roundIndex - (s.phase === 'done' ? 0 : 0)) : 15;

  // progress dots: gold = prize revealed, pink = bust revealed
  if (s.lastReveal && s.phase === 'reveal') {
    $('tLast').innerHTML = `Last: <b>${esc(s.lastReveal.label)}</b> → ${esc(s.lastReveal.winnerName || 'no bids')}`;
  }
}

setInterval(() => {
  if (!state || !state.endsAt) { $('timerText').textContent = ''; return; }
  const total = state.settings.bidSeconds * 1000;
  const left = Math.max(0, state.endsAt - Date.now());
  $('timerFill').style.width = (100 * left / total) + '%';
  $('timerText').textContent = Math.ceil(left / 1000) + ' seconds left';
}, 250);

socket.on('state', render);
socket.on('reveal', r => {
  $('suspense').classList.remove('hidden');
  $('revealBody').classList.add('hidden');
  $('revealOverlay').classList.remove('hidden');
  setTimeout(() => {
    const card = $('revealCard');
    card.className = 'reveal-card ' + (r.bust ? 'bust' : 'prize');
    $('revealEmoji').textContent = r.noBids ? '🔥' : (r.bust ? '💥' : '🎁');
    $('revealTitle').textContent = r.noBids ? 'No bids — lot burned!' : r.label;
    $('revealDetail').textContent = r.noBids ? '' : r.detail;
    $('revealMeta').textContent = r.noBids ? '' :
      `${r.winnerName} paid ${money(r.bid)}` + (r.eliminated.length ? ` · ☠️ ${r.eliminated.join(', ')} busted out!` : '');
    $('suspense').classList.add('hidden');
    $('revealBody').classList.remove('hidden');
  }, 2800);
  clearTimeout(window.__rh);
  window.__rh = setTimeout(() => $('revealOverlay').classList.add('hidden'), 12000);
});

if (code) {
  socket.emit('spectate', { code }, r => {
    if (!r.ok) $('lotLine').textContent = 'Room not found — check the code in the URL.';
  });
} else {
  $('lotLine').textContent = 'Open this page with ?room=CODE from the host screen.';
}
</script>
</body>
</html>
